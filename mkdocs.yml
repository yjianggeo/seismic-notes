site_name: Seismic Notes
site_description: 地震学与 DAS 学习笔记
site_author: Jiang Yi
site_url: https://yjianggeo.github.io/source-spectrum-site/

theme:
  name: material
  language: zh

  features:

    # 导航
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - navigation.indexes

    # 搜索
    - search.highlight
    - search.share
    - search.suggest

    # 内容
    - content.tabs.link
    - content.code.copy
    - content.code.annotate

    # 编辑按钮
    - content.action.edit
    - content.action.view

    # 自动隐藏头部
    - header.autohide

  palette:

    # 浅色
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo

      toggle:
        icon: material/brightness-7
        name: 切换深色模式

    # 深色
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo

      toggle:
        icon: material/brightness-4
        name: 切换浅色模式

  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

repo_url: https://github.com/yjianggeo/source-spectrum-site
repo_name: yjianggeo/source-spectrum-site
edit_uri: edit/main/docs/

markdown_extensions:

  # 基础
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables

  # 自动目录
  - toc:
      permalink: true
      toc_depth: 3

  # 数学公式
  - pymdownx.arithmatex:
      generic: true

  # 强调
  - pymdownx.betterem:
      smart_enable: none

  # 下划线/插入
  - pymdownx.caret

  # 折叠块
  - pymdownx.details

  # Emoji
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.highlight:    # 代码高亮
      anchor_linenums: false  # ⚠️ true 会导致 NoneType crash
      line_spans: __span
      pygments_lang_class: true

  # 行内高亮
  - pymdownx.inlinehilite

  # 键盘键
  - pymdownx.keys

  # 高亮标记
  - pymdownx.mark

  # 智能符号
  - pymdownx.smartsymbols

  # 代码片段
  - pymdownx.snippets

  # 高级代码块
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # 标签页
  - pymdownx.tabbed:
      alternate_style: true

  # 任务列表
  - pymdownx.tasklist:
      custom_checkbox: true

  # 删除线
  - pymdownx.tilde

plugins:

  # 搜索
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'


extra:

  generator: false

  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yjianggeo

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:

  # MathJax配置
  - assets/javascripts/mathjax.js

  # ES6兼容
  - https://polyfill.io/v3/polyfill.min.js?features=es6

  # MathJax
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

  # 中英文切换
  - assets/javascripts/lang-toggle.js

not_in_nav: |
  brune-en.md
  q-spectral-ratio-en.md
  das-en.md
  vsp-en.md
  surface-coda-en.md
  fk-radon-en.md

nav:
  - 首页: index.md

  - 震源理论:
      - Brune模型: brune.md

  - 地震波衰减:
      - 谱比法 Q 值反演: q-spectral-ratio.md

  - 垂直地震剖面:
      - VSP 原理与应用: vsp.md

  - 面波与尾波:
      - 波速提取与监测: surface-coda.md

  - 地震数据处理:
      - F-K 分析与 Radon 变换: fk-radon.md

  - DAS 分布式声学传感:
      - 基本原理与应用: das.md